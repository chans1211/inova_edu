<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Innova Edu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg:#FFF9EC;--ink:#1F2547;--card:#fff;--line:#E6DFCB;--mute:#6B6F8F;--pri:#5B3DF5;--priD:#3F27C4;--sun:#FFB400;--good:#12A594;--goodBg:#D8F5EF;--bad:#E5484D;--badBg:#FFE2E3;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152B;--ink:#F2F0FF;--card:#1E2040;--line:#34376A;--mute:#A4A8D0;--pri:#8B74FF;--priD:#6A53E0;--goodBg:#0F3A3A;--badBg:#4A1F2B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14152B;--ink:#F2F0FF;--card:#1E2040;--line:#34376A;--mute:#A4A8D0;--pri:#8B74FF;--priD:#6A53E0;--goodBg:#0F3A3A;--badBg:#4A1F2B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
h1,h2,h3,.f{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;margin:0}
#app{max-width:520px;margin:0 auto;padding:12px 16px 96px}
button{font:inherit;font-weight:800;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 14px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800}
.btn{display:block;width:100%;padding:14px;border-radius:16px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--priD);font-size:1.05rem}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--priD)}
.btn[disabled]{background:var(--line);color:var(--mute);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.subs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.sub{flex:0 0 auto;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.sub[aria-pressed=true]{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0}
.node{width:84px;height:84px;border-radius:50%;background:var(--c);color:#fff;font-size:2rem;box-shadow:0 7px 0 rgba(0,0,0,.25);position:relative;display:grid;place-items:center}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.node.lock{background:var(--line);color:var(--mute);box-shadow:0 7px 0 rgba(0,0,0,.08);cursor:not-allowed}
.node small{position:absolute;bottom:-4px;font-size:.8rem;background:var(--sun);color:#1F2547;border-radius:99px;padding:0 8px}
.lbl{text-align:center;font-weight:800;margin-top:-6px;max-width:220px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:1.05rem}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}
.opt.ok{border-color:var(--good);background:var(--goodBg)}
.opt.no{border-color:var(--bad);background:var(--badBg)}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--card)}
.fb>div{max-width:520px;margin:0 auto}
.fb.ok{background:var(--goodBg)}.fb.no{background:var(--badBg)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.nav button{flex:1;max-width:160px;padding:8px;border-radius:12px;font-size:.85rem;color:var(--mute)}
.nav button[aria-current=page]{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.nav span{display:block;font-size:1.4rem}
input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:1.1rem;margin:12px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row.me{background:color-mix(in srgb,var(--sun) 22%,transparent);border-radius:12px;padding:10px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{text-align:center;font-size:.8rem;padding:10px 4px;border:2px solid var(--line);border-radius:14px}
.bd.off{opacity:.4;filter:grayscale(1)}.bd b{display:block;font-size:1.8rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats .card{margin:0;text-align:center}.stats b{font-size:1.6rem;display:block}
.hero{text-align:center;padding:36px 0 8px}.hero .logo{font-size:4rem}
.auth{min-height:calc(100vh - 24px);display:grid;gap:16px;align-content:center;padding:8px 0}
.brand{background:linear-gradient(145deg,#5B3DF5,#3F27C4);color:#fff;border-radius:24px;padding:24px}
.brand h1{font-size:2rem;margin:8px 0}.brand p{margin:0 0 12px;opacity:.9}.brand ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.95rem}
.box{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px}
.box label{display:block;font-size:.9rem;color:var(--mute);margin-top:10px}.box input,.box select{margin:4px 0 0}
select{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.seg button{padding:10px;border-radius:10px;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.err{color:var(--bad);min-height:1.2em;margin:10px 0 6px;font-size:.9rem}
@media(min-width:900px){#app:has(.auth){max-width:960px}.auth{grid-template-columns:1fr 1fr;gap:0;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(31,37,71,.2)}.brand{border-radius:0;padding:48px;display:flex;flex-direction:column;justify-content:center}.box{border:0;border-radius:0;padding:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const SUBJ=[
{id:"mat",n:"Matemáticas",e:"🧮",c:"#5B3DF5",L:[
{t:"Sumas y restas",tip:"Sumar es juntar cantidades y restar es quitar. Para 8 + 5, cuenta desde el 8: 9, 10, 11, 12, 13.",q:[["¿Cuánto es 48 + 27?",["65","75","85","73"],1],["¿Cuánto es 100 − 36?",["64","74","54","66"],0],["Tenías 5 manzanas y compraste 8 más. ¿Cuántas tienes?",["12","13","14","3"],1],["¿Cuánto es 9 + 9 − 5?",["11","13","14","23"],1]]},
{t:"Multiplicación",tip:"Multiplicar es sumar el mismo número varias veces. 4 × 3 es 4 + 4 + 4 = 12.",q:[["¿Cuánto es 7 × 8?",["54","56","63","48"],1],["¿Cuánto es 12 × 5?",["50","60","65","70"],1],["Una caja tiene 6 lápices. ¿Cuántos hay en 9 cajas?",["54","45","63","15"],0],["¿Cuánto es 9 × 0?",["9","1","0","90"],2]]},
{t:"Fracciones",tip:"Una fracción es una parte de un todo. En 1/2, el 2 dice en cuántas partes se dividió y el 1 cuántas tomas.",q:[["¿Qué fracción representa la mitad?",["1/3","1/2","2/3","1/4"],1],["¿Cuánto es 1/4 + 1/4?",["2/8","1/2","1/8","1/4"],1],["¿Cuál fracción es la mayor?",["1/2","1/4","1/8","1/3"],0],["¿Cuánto es 3/4 de 20?",["5","10","15","12"],2]]},
{t:"Figuras geométricas",tip:"El triángulo tiene 3 lados, el cuadrado y el rectángulo tienen 4. El círculo no tiene lados rectos. Los puntos donde se unen los lados se llaman vértices.",q:[
 ["¿Cuántos lados tiene un triángulo?",["2","3","4","5"],1],
 ["¿Cuántos lados tiene un cuadrado?",["3","4","5","6"],1],
 ["¿Qué figura no tiene lados rectos?",["Cuadrado","Rectángulo","Círculo","Triángulo"],2],
 ["¿Cuántos vértices tiene un rectángulo?",["2","3","4","6"],2]]},
{t:"División",tip:"Dividir es repartir en partes iguales. 12 ÷ 3 = 4 porque 3 × 4 = 12.",q:[
 ["¿Cuánto es 20 ÷ 4?",["4","5","6","8"],1],
 ["Reparte 18 dulces entre 3 niños. ¿Cuántos recibe cada uno?",["5","6","7","9"],1],
 ["¿Cuánto es 45 ÷ 5?",["8","9","10","7"],1],
 ["¿Cuánto es 7 ÷ 1?",["1","0","7","8"],2]]}]},
{id:"cie",n:"Ciencias",e:"🔬",c:"#12A594",L:[
{t:"Seres vivos",tip:"Los seres vivos nacen, crecen, se alimentan, se reproducen y mueren. Todos están formados por células.",q:[["¿Qué necesitan las plantas para la fotosíntesis?",["Solo tierra","Luz, agua y dióxido de carbono","Solo agua","Oxígeno y azúcar"],1],["¿Cuál de estos animales es un mamífero?",["Tiburón","Delfín","Pingüino","Cocodrilo"],1],["Los animales que comen solo plantas son:",["Carnívoros","Herbívoros","Omnívoros","Carroñeros"],1],["La unidad básica de los seres vivos es:",["El átomo","El órgano","La célula","El tejido"],2]]},
{t:"Sistema solar",tip:"El Sol es una estrella. Ocho planetas giran a su alrededor y la Tierra es el tercero desde el Sol.",q:[["¿Qué planeta está más cerca del Sol?",["Venus","Mercurio","Marte","Tierra"],1],["¿Qué planeta se conoce como el planeta rojo?",["Marte","Júpiter","Saturno","Venus"],0],["La Tierra tarda en dar una vuelta al Sol:",["Un día","Un mes","Un año","Una semana"],2],["¿Cuál es el planeta más grande?",["Saturno","Júpiter","Neptuno","Tierra"],1]]},
{t:"Materia y energía",tip:"La materia puede ser sólida, líquida o gaseosa. La energía hace que las cosas se muevan o cambien.",q:[["El agua que hierve pasa de líquido a:",["Sólido","Gas","Plasma","Polvo"],1],["¿Cuál es una fuente de energía renovable?",["Carbón","Petróleo","Energía solar","Gas natural"],2],["Al congelarse, el agua cambia a estado:",["Gaseoso","Sólido","Líquido","Plasma"],1],["¿Qué fuerza nos mantiene en el suelo?",["Magnetismo","Fricción","Gravedad","Inercia"],2]]},
{t:"El cuerpo humano",tip:"El corazón bombea la sangre, los pulmones nos dejan respirar y los huesos nos dan forma y protegen los órganos. Tenemos cinco sentidos.",q:[
 ["¿Qué órgano bombea la sangre?",["Pulmón","Corazón","Estómago","Riñón"],1],
 ["¿Cuántos sentidos tenemos?",["3","4","5","6"],2],
 ["¿Qué órganos usamos para respirar?",["Pulmones","Hígado","Cerebro","Corazón"],0],
 ["¿Para qué sirven los huesos?",["Digerir","Dar soporte y proteger","Producir luz","Bombear sangre"],1]]},
{t:"El ciclo del agua",tip:"El Sol calienta el agua y se evapora. El vapor se enfría y forma nubes (condensación). Luego cae como lluvia (precipitación).",q:[
 ["¿Qué proceso convierte el agua líquida en vapor?",["Condensación","Evaporación","Congelación","Precipitación"],1],
 ["Cuando el vapor se enfría y forma nubes ocurre la:",["Evaporación","Condensación","Fusión","Erosión"],1],
 ["La lluvia es parte de la:",["Precipitación","Evaporación","Fusión","Sublimación"],0],
 ["¿Cuánto de la superficie de la Tierra cubre el agua, aproximadamente?",["10%","30%","70%","100%"],2]]}]},
{id:"len",n:"Lenguaje",e:"📚",c:"#E5484D",L:[
{t:"Ortografía",tip:"Las palabras que terminan en z cambian a c en plural: lápiz → lápices. Las palabras con tilde marcan la sílaba más fuerte.",q:[["¿Cuál palabra está bien escrita?",["Exelente","Excelente","Eccelente","Ecselente"],1],["Completa: Ya ___ terminado la tarea.",["he","e","eh","hé"],0],["¿Cuál palabra está bien acentuada?",["Canción","Cancion","Cáncion","Cancíon"],0],["¿Cuál es el plural de «lápiz»?",["Lápizes","Lápices","Lapices","Lápizs"],1]]},
{t:"Gramática",tip:"El sustantivo nombra (casa), el adjetivo describe (grande) y el verbo dice una acción (correr).",q:[["En «El gato duerme», el verbo es:",["El","gato","duerme","Ninguno"],2],["Un sustantivo es una palabra que:",["Indica acción","Nombra personas, animales o cosas","Describe cualidades","Une palabras"],1],["¿Cuál de estas palabras es un adjetivo?",["Correr","Casa","Rápido","Mañana"],2],["¿Cuál es el antónimo de «alegre»?",["Feliz","Triste","Contento","Risueño"],1]]},
{t:"Lectura y figuras",tip:"Una metáfora dice que una cosa es otra para decorar una idea. Las palabras se dividen en sílabas, que son golpes de voz.",q:[["«Tus ojos son dos luceros» es una:",["Metáfora","Rima","Pregunta","Sílaba"],0],["El género narrativo incluye:",["Cuentos y novelas","Solo poemas","Obras de teatro","Recetas"],0],["¿Cuántas sílabas tiene «mariposa»?",["3","4","5","2"],1],["¿Qué signo cierra una pregunta?",["!","?",".",","],1]]},
{t:"Sinónimos y antónimos",tip:"Los sinónimos significan casi lo mismo (bonito y hermoso). Los antónimos significan lo contrario (alto y bajo).",q:[
 ["¿Cuál es un sinónimo de «grande»?",["Pequeño","Enorme","Delgado","Corto"],1],
 ["¿Cuál es el antónimo de «día»?",["Tarde","Noche","Sol","Mañana"],1],
 ["¿Cuál es un sinónimo de «rápido»?",["Veloz","Lento","Tardo","Pesado"],0],
 ["¿Cuál es el antónimo de «subir»?",["Trepar","Bajar","Saltar","Correr"],1]]},
{t:"Mayúsculas y puntos",tip:"Usamos mayúscula al empezar una oración y en los nombres propios (Bogotá, Ana). Las oraciones terminan con punto.",q:[
 ["¿Cuándo se escribe mayúscula?",["Al inicio de una oración","Siempre","Nunca","En medio de las palabras"],0],
 ["¿Cuál nombre propio está bien escrito?",["bogotá","Bogotá","bOgotá","BOgota"],1],
 ["¿Qué signo cierra una oración que afirma algo?",["Punto","Interrogación","Coma","Guion"],0],
 ["¿Cuál oración está bien escrita?",["mi perro se llama Rocky.","Mi perro se llama Rocky.","mi Perro se llama rocky","Mi perro se llama rocky"],1]]}]},
{id:"soc",n:"Sociales",e:"🌎",c:"#E08A00",L:[
{t:"Colombia",tip:"Colombia tiene 32 departamentos y su capital es Bogotá. Se independizó después de la Batalla de Boyacá, en 1819.",q:[["¿Cuál es la capital de Colombia?",["Medellín","Bogotá","Cali","Barranquilla"],1],["¿Qué río desemboca en Barranquilla?",["Magdalena","Amazonas","Cauca","Atrato"],0],["¿En qué año fue la Batalla de Boyacá?",["1810","1819","1830","1850"],1],["¿Cuántos departamentos tiene Colombia?",["32","30","28","36"],0]]},
{t:"El mundo",tip:"La Tierra tiene cinco continentes y cinco océanos. La línea del Ecuador la divide en hemisferio norte y sur.",q:[["¿Cuál es el continente más grande?",["África","Asia","Europa","América"],1],["¿Cuál es el océano más grande?",["Atlántico","Índico","Pacífico","Ártico"],2],["¿Cuál es la capital de Argentina?",["Lima","Buenos Aires","Santiago","Quito"],1],["¿Qué línea divide la Tierra en hemisferio norte y sur?",["Meridiano de Greenwich","Ecuador","Trópico de Cáncer","Polo"],1]]},
{t:"Ciudadanía",tip:"Todos tenemos derechos y deberes. La Constitución es la ley más importante de un país.",q:[["La Constitución es:",["Un libro de cuentos","La norma suprema de un país","Un decreto escolar","Un tratado comercial"],1],["Un derecho de los niños es:",["Trabajar","Estudiar","Votar","Conducir"],1],["Votar es un derecho y un deber de:",["Los mayores de edad","Los menores","Los turistas","Las mascotas"],0],["Cuidar el medio ambiente significa:",["Botar basura","Reciclar y ahorrar agua","Talar árboles","Contaminar"],1]]},
{t:"Mi comunidad",tip:"Una comunidad es un grupo de personas que viven cerca y se ayudan. Los servicios públicos, como el agua y la luz, sirven a todos. Las normas nos ayudan a convivir.",q:[
 ["¿Quiénes cuidan nuestra salud en un hospital?",["Médicos","Bomberos","Panaderos","Taxistas"],0],
 ["Una familia es:",["Un equipo deportivo","Un grupo unido por lazos de afecto o parentesco","Una tienda","Un país"],1],
 ["¿Cuál es un servicio público?",["Juguete","Dulces","Agua potable","Videojuego"],2],
 ["¿Para qué sirven las normas?",["Para pelear","Para ignorar a otros","Para convivir en armonía","Para no estudiar"],2]]},
{t:"Regiones de Colombia",tip:"Colombia tiene cinco regiones naturales: Caribe, Andina, Pacífica, Orinoquía y Amazonía. La cordillera de los Andes cruza el país.",q:[
 ["¿En qué región natural está Barranquilla?",["Andina","Caribe","Pacífica","Amazonía"],1],
 ["¿Qué región tiene la selva del Amazonas?",["Amazonía","Caribe","Andina","Orinoquía"],0],
 ["¿Qué cordillera cruza Colombia?",["Los Alpes","Los Andes","Los Himalayas","Las Rocosas"],1],
 ["¿Qué mar baña la costa norte de Colombia?",["Mar Rojo","Mar Negro","Mar Caribe","Mar Muerto"],2]]}]}];
const BADGES=[["🌱","Primer paso",s=>Object.keys(s.done).length>=1],["🔥","Racha de 3",s=>s.streak>=3],["⭐","100 XP",s=>s.xp>=100],["💯","Lección perfecta",s=>Object.values(s.done).includes(4)],["🧭","Explorador",s=>SUBJ.every(x=>x.L.some((_,i)=>s.done[x.id+i]!=null))],["🏆","Maestro",s=>Object.keys(s.done).length>=12]];
const RIVALS=[["Valentina",340],["Santiago",285],["Mariana",210],["Dylan",160],["Camila",95]];
const today=()=>new Date().toISOString().slice(0,10);
const key="innovaedu_v1";
const DEF={name:"",grade:"",xp:0,streak:0,last:"",hearts:5,done:{},day:"",dayXp:0,sub:"mat",theme:""};let S={...DEF};
const UK="innovaedu_users",SK="innovaedu_sess";let U={},cur="";
try{U=JSON.parse(localStorage.getItem(UK)||"{}");cur=localStorage.getItem(SK)||""}catch(e){}
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
if(cur&&U[cur])S={...DEF,...U[cur].d,name:U[cur].n};else cur="";
const save=()=>{if(!cur||!U[cur])return;U[cur].d=S;try{localStorage.setItem(UK,JSON.stringify(U))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rollDay(){const t=today();if(S.day!==t){S.day=t;S.dayXp=0;S.hearts=5;
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.last&&S.last!==y&&S.last!==t)S.streak=0}save()}
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
let tab="home",L=null;
const GOAL=30;

function hdr(){return `<div class="top"><div style="display:flex;align-items:center;gap:8px">${LOGO}<h1 style="font-size:1.3rem">Innova <span style="color:var(--pri)">Edu</span></h1></div>
<div style="display:flex;gap:6px"><span class="chip" title="Racha">🔥 ${S.streak}</span><span class="chip" title="XP">⚡ ${S.xp}</span><span class="chip" title="Vidas">❤️ ${S.hearts}</span></div></div>`}
function nav(){const t=[["home","📖","Aprender"],["rank","🏅","Ranking"],["me","👤","Perfil"]];
 return `<nav class="nav" aria-label="Principal">${t.map(x=>`<button data-tab="${x[0]}" ${tab===x[0]?'aria-current="page"':''}><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`}

function render(){
 applyTheme();const a=$("#app");if(!S.name){return auth(a)}
 if(!S.name){a.innerHTML=`<div class="hero"><div class="logo">🚀</div><h1 style="font-size:2.4rem">Innova Edu</h1>
 <p style="color:var(--mute)">Aprende las materias del colegio en lecciones cortas. Gana XP, mantén tu racha y sube de nivel.</p></div>
 <label for="nm">¿Cómo te llamas?</label><input id="nm" maxlength="20" placeholder="Tu nombre" autocomplete="given-name">
 <button class="btn" id="go">Empezar a aprender</button>`;
  const go=()=>{const v=$("#nm").value.trim();if(!v){$("#nm").focus();return}S.name=v;save();render()};
  $("#go").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()};return}
 if(L){return lesson()}
 let h=hdr();
 if(tab==="home")h+=home();else if(tab==="rank")h+=rank();else h+=me();
 a.innerHTML=h+nav();
 a.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 a.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.sub;save();render()});
 a.querySelectorAll("[data-les]").forEach(b=>b.onclick=()=>start(+b.dataset.les));
 const th=$("#theme");if(th)th.onclick=()=>{const dark=matchMedia("(prefers-color-scheme:dark)").matches;const cur=S.theme||(dark?"dark":"light");S.theme=cur==="dark"?"light":"dark";save();render()};
 const rs=$("#reset");if(rs)rs.onclick=()=>{if(rs.dataset.s){const n=S.name,g=S.grade;S={...DEF,name:n,grade:g};save();rollDay();render()}else{rs.dataset.s=1;rs.textContent="Toca otra vez para confirmar"}};
 const lo=$("#out");if(lo)lo.onclick=()=>{cur="";try{localStorage.removeItem(SK)}catch(e){}S={...DEF};tab="home";render()};const rc=$("#heal");if(rc)rc.onclick=()=>{if(S.xp>=50&&S.hearts<5){S.xp-=50;S.hearts=5;save();render()}};
}
function home(){
 const sb=SUBJ.find(x=>x.id===S.sub),pct=Math.min(100,Math.round(S.dayXp/GOAL*100));
 const tabs=SUBJ.map(x=>`<button class="sub" style="--c:${x.c}" data-sub="${x.id}" aria-pressed="${x.id===S.sub}">${x.e} ${x.n}</button>`).join("");
 const nodes=sb.L.map((l,i)=>{const k=sb.id+i,d=S.done[k],open=i===0||S.done[sb.id+(i-1)]!=null;
  const off=i%2?"margin-left:70px":"margin-right:70px";
  return `<div style="text-align:center;${off}"><button class="node ${open?"":"lock"}" ${open?`data-les="${i}"`:'disabled aria-label="Bloqueada"'} style="--c:${sb.c}" aria-label="${esc(l.t)}">${open?sb.e:"🔒"}${d!=null?`<small>${"★".repeat(Math.max(1,Math.ceil(d/1.4)))}</small>`:""}</button><div class="lbl">${l.t}</div></div>`}).join("");
 const heal=(S.hearts<=0?'<div class="card">Te quedaste sin vidas. Vuelven mañana o puedes recargarlas con 50 XP.</div>':"")+(S.hearts<5?`<button class="btn ghost" id="heal" ${S.xp<50?"disabled":""} style="margin-bottom:12px">Recargar vidas por 50 XP</button>`:"");
 return `<h2 style="font-size:1.4rem;margin-bottom:12px">¡Hola, ${esc(S.name)}! 👋</h2><div class="card"><div style="display:flex;justify-content:space-between"><span>Meta de hoy</span><span>${Math.min(S.dayXp,GOAL)}/${GOAL} XP</span></div>
 <div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>${heal}
 <div class="subs" role="group" aria-label="Materias">${tabs}</div>
 <h2 style="font-size:1.3rem">${sb.e} ${sb.n}</h2><div class="path">${nodes}</div>`}
function rank(){
 const all=[...RIVALS,[S.name+" (tú)",S.xp]].sort((a,b)=>b[1]-a[1]);
 return `<h2>Ranking semanal</h2><p style="color:var(--mute)">Compara tu XP con otros estudiantes. Los demás son de ejemplo.</p><div class="card">${all.map((r,i)=>`<div class="row ${r[0].includes("(tú)")?"me":""}"><span style="width:28px">${["🥇","🥈","🥉"][i]||i+1}</span><span style="flex:1">${esc(r[0])}</span><span>⚡ ${r[1]}</span></div>`).join("")}</div>`}
function me(){
 const n=Object.keys(S.done).length,tot=SUBJ.reduce((a,x)=>a+x.L.length,0),lvl=Math.floor(S.xp/100)+1;
 return `<div class="card" style="text-align:center"><div style="font-size:3rem">🧑‍🎓</div><h2>${esc(S.name)}</h2><p style="margin:4px 0 10px;color:var(--mute)">Nivel ${lvl}${S.grade?" · "+esc(S.grade):""}</p>
 <div style="display:flex;gap:10px;align-items:center"><div class="bar"><i style="width:${S.xp%100}%"></i></div><span>${S.xp%100}/100</span></div></div>
 <div class="stats"><div class="card"><b>🔥 ${S.streak}</b>días de racha</div><div class="card"><b>⚡ ${S.xp}</b>XP total</div><div class="card"><b>✅ ${n}/${tot}</b>lecciones</div><div class="card"><b>❤️ ${S.hearts}</b>vidas</div></div>
 <h3 style="margin:18px 0 10px">Logros</h3><div class="badges">${BADGES.map(b=>`<div class="bd ${b[2](S)?"":"off"}"><b>${b[0]}</b>${b[1]}</div>`).join("")}</div>
 <h3 style="margin:18px 0 10px">Ajustes</h3><button class="btn ghost" id="theme" style="margin-bottom:12px">Cambiar tema claro/oscuro</button><button class="btn ghost" id="out" style="margin-bottom:12px">Cerrar sesión</button><button class="btn ghost" id="reset" style="color:var(--bad)">Borrar progreso</button>`}

function shuffle(a){a=a.map((t,i)=>[t,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(i){
 if(S.hearts<=0)return;
 const sb=SUBJ.find(x=>x.id===S.sub);
 L={sb,i,intro:!!sb.L[i].tip,qs:shuffle(sb.L[i].q.map(q=>q)).map(x=>x[0]),n:0,ok:0,sel:null,chk:false,hp:S.hearts};
 L.qs=L.qs.map(q=>({t:q[0],o:shuffle(q[1]),a:q[2]}));render()}
function lesson(){
 if(L.intro){
  const l=L.sb.L[L.i];
  $("#app").innerHTML=`<div class="top"><button id="quit" aria-label="Salir" style="font-size:1.6rem">✕</button></div>
  <div class="card" style="text-align:center;padding:28px"><div style="font-size:3rem">${L.sb.e}</div><h2 style="margin:8px 0">${esc(l.t)}</h2>
  <p style="font-size:1.1rem;line-height:1.5;text-align:left">${esc(l.tip)}</p></div><button class="btn" id="go">¡Listo, a practicar!</button>`;
  $("#go").onclick=()=>{L.intro=false;lesson()};
  $("#quit").onclick=()=>{L=null;render()};
  return
 }
 const q=L.qs[L.n],pct=Math.round(L.n/L.qs.length*100);
 const opts=q.o.map((o,k)=>{let c="opt";if(L.chk){if(o[1]===q.a)c+=" ok";else if(L.sel===k)c+=" no"}else if(L.sel===k)c+=" sel";
  return `<button class="${c}" data-o="${k}" ${L.chk?"disabled":""}>${esc(o[0])}</button>`}).join("");
 let foot;
 if(!L.chk)foot=`<div class="fb"><div><button class="btn" id="chk" ${L.sel==null?"disabled":""}>Comprobar</button></div></div>`;
 else{const good=q.o[L.sel][1]===q.a;
  foot=`<div class="fb ${good?"ok":"no"}" role="status"><div><h3 style="margin-bottom:10px;color:${good?"var(--good)":"var(--bad)"}">${good?"¡Correcto! 🎉":"Respuesta correcta: "+esc(q.o.find(o=>o[1]===q.a)[0])}</h3><button class="btn" id="nx" style="background:${good?"var(--good)":"var(--bad)"};box-shadow:none">Continuar</button></div></div>`}
 $("#app").innerHTML=`<div class="top"><button id="quit" aria-label="Salir" style="font-size:1.6rem">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="chip">❤️ ${S.hearts}</span></div>
 <h2 style="font-size:1.5rem;margin:18px 0">${esc(q.t)}</h2>${opts}<div style="height:110px"></div>${foot}`;
 document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{L.sel=+b.dataset.o;lesson()});
 $("#quit").onclick=()=>{L=null;render()};
 const c=$("#chk");if(c)c.onclick=()=>{L.chk=true;if(q.o[L.sel][1]===q.a)L.ok++;else S.hearts=Math.max(0,S.hearts-1);save();lesson()};
 const nx=$("#nx");if(nx)nx.onclick=()=>{
  if(S.hearts<=0){return end(false)}
  L.n++;L.sel=null;L.chk=false;L.n>=L.qs.length?end(true):lesson()}}
function end(win){
 const {sb,i,ok}=L,tot=L.qs.length,perfect=ok===tot;let gain=0;
 if(win){gain=ok*10+(perfect?10:0);S.xp+=gain;S.dayXp+=gain;
  if(S.done[sb.id+i]==null||ok>S.done[sb.id+i])S.done[sb.id+i]=ok;
  if(S.last!==today()){S.streak++;S.last=today()}}
 save();L=null;
 $("#app").innerHTML=`<div class="hero"><div class="logo">${win?(perfect?"🏆":"🎉"):"💔"}</div><h1 style="font-size:2rem">${win?"¡Lección completada!":"Te quedaste sin vidas"}</h1>
 <p style="color:var(--mute)">${win?`Acertaste ${ok} de ${tot}.`:"Repasa y vuelve a intentarlo. Las vidas vuelven mañana."}</p></div>
 ${win?`<div class="stats" style="margin-bottom:18px"><div class="card"><b>⚡ +${gain}</b>XP ganados</div><div class="card"><b>🔥 ${S.streak}</b>días de racha</div></div>`:""}
 <button class="btn" id="back">Volver al inicio</button>`;
 $("#back").onclick=()=>{tab="home";render()}}
const LOGO='<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#5B3DF5"/><path d="M12 28V12l16 16V12" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="29" cy="11" r="3" fill="#FFB400"/></svg>';
let mode="in";
function login(e){cur=e;try{localStorage.setItem(SK,e)}catch(x){}S={...DEF,...U[e].d,name:U[e].n};rollDay();tab="home";render()}
function auth(a){
 const reg=mode==="up";
 a.innerHTML=`<div class="auth"><section class="brand">${LOGO}<h1>Innova Edu</h1><p>Aprende las materias del colegio con lecciones cortas, XP y rachas.</p><ul><li>📚 Matemáticas, Ciencias, Lenguaje y Sociales</li><li>🔥 Rachas y metas diarias</li><li>🏅 Logros, niveles y ranking</li></ul></section>
 <form class="box" id="af" novalidate><div class="seg"><button type="button" data-m="in" aria-pressed="${!reg}">Ingresar</button><button type="button" data-m="up" aria-pressed="${reg}">Crear cuenta</button></div>
 ${reg?`<label>Nombre<input id="fn" maxlength="20" autocomplete="given-name"></label><label>Grado<select id="fg">${["3° primaria","4° primaria","5° primaria","6°","7°","8°","9°","10°","11°"].map(g=>`<option>${g}</option>`).join("")}</select></label>`:""}
 <label>Correo<input id="fe" type="email" autocomplete="email"></label><label>Contraseña<input id="fp" type="password" autocomplete="${reg?"new-password":"current-password"}"></label>
 ${reg?`<label>Repite la contraseña<input id="fq" type="password" autocomplete="new-password"></label>`:""}
 <p class="err" role="alert"></p><button class="btn" type="submit">${reg?"Crear cuenta":"Ingresar"}</button><button class="btn ghost" type="button" id="gu" style="margin-top:12px">Probar como invitado</button><p style="font-size:.8rem;color:var(--mute);text-align:center">Tu cuenta y progreso se guardan en este dispositivo.</p></form></div>`;
 a.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;auth(a)});
 $("#gu").onclick=()=>{cur="";S={...DEF,name:"Invitado"};rollDay();render()};
 $("#af").onsubmit=ev=>{ev.preventDefault();const e=$("#fe").value.trim().toLowerCase(),p=$("#fp").value,bad=m=>{$(".err").textContent=m};
  if(!/^\S+@\S+\.\S+$/.test(e))return bad("Escribe un correo válido.");
  if(p.length<6)return bad("La contraseña debe tener al menos 6 caracteres.");
  if(reg){const n=$("#fn").value.trim();if(!n)return bad("Escribe tu nombre.");if(p!==$("#fq").value)return bad("Las contraseñas no coinciden.");if(U[e])return bad("Ese correo ya tiene cuenta. Ingresa.");
   U[e]={n,h:hash(p),d:{...DEF,grade:$("#fg").value}};try{localStorage.setItem(UK,JSON.stringify(U))}catch(x){}login(e)}
  else{if(!U[e]||U[e].h!==hash(p))return bad("Correo o contraseña incorrectos.");login(e)}}}
rollDay();render();
</script>
</body>
</html>
